name: Deploy VLinkGo shortlink Worker

on:
  push:
    branches:
      - experiment/one-time-gate
    paths:
      - "src/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-vlinkgo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlinkgo-shortlink-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy shortlink-ku-pro
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/one-time-gate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

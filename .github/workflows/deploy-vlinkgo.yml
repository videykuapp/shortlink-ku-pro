name: Deploy VLinkGo shortlink Worker

on:
  push:
    branches:
      - experiment/one-time-gate
    paths:
      - "src/**"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vlinkgo-shortlink-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy shortlink-ku-pro
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/one-time-gate

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b968ff7861ca3e817d6fc99423328b8c
          command: deploy
